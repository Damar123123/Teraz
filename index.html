<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teraz Coffee - Ulasan & Feedback</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Plus Jakarta Sans & Playfair Display -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        coffee: {
                            50: '#FDFBF7',
                            100: '#F7F2EA',
                            200: '#EBE0D0',
                            300: '#D7C2A5',
                            400: '#C3A37B',
                            500: '#AF8453',
                            600: '#8C643A',
                            700: '#68482A',
                            800: '#48311D',
                            900: '#2A1B10',
                        }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom Keyframe Animations */
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(2deg); }
        }
        .animate-float {
            animation: float 4s ease-in-out infinite;
        }
        /* Background decorative subtle grid */
        .bg-pattern {
            background-color: #FDFBF7;
            background-image: radial-gradient(#EBE0D0 0.8px, transparent 0.8px);
            background-size: 16px 16px;
        }
    </style>
</head>
<body class="bg-pattern text-coffee-900 font-sans min-h-screen flex flex-col justify-between items-center p-4 sm:p-6 antialiased">

    <!-- Top Ambient Background Glow -->
    <div class="fixed top-0 left-1/2 -translate-x-1/2 w-full max-w-md h-72 bg-gradient-to-b from-coffee-200/50 via-coffee-100/20 to-transparent blur-3xl -z-10 pointer-events-none"></div>

    <!-- Main Container -->
    <main class="w-full max-w-md my-auto flex flex-col items-center text-center">
        
        <!-- Image Logo Container -->
        <div class="relative mb-6 group">
            <!-- Glow Effect -->
            <div class="absolute -inset-1.5 bg-gradient-to-r from-coffee-400 to-coffee-700 rounded-2xl blur opacity-30 group-hover:opacity-60 transition duration-500"></div>
            
            <!-- Logo Box -->
            <div class="relative w-40 h-40 sm:w-48 sm:h-48 bg-coffee-900 border-2 border-coffee-400/40 rounded-2xl p-2 flex items-center justify-center shadow-2xl shadow-coffee-900/20 overflow-hidden">
                <img src="Teraz.jpeg" alt="Teraz Coffee Logo" class="w-full h-full object-cover rounded-xl">
            </div>
        </div>

        <!-- Brand Name Badge -->
        <div class="inline-flex items-center gap-1.5 px-3.5 py-1 rounded-full bg-coffee-100 border border-coffee-200 text-coffee-700 text-xs font-semibold tracking-wider uppercase mb-4 shadow-sm">
            <i data-lucide="sparkles" class="w-3.5 h-3.5 text-coffee-500"></i>
            Teraz Coffee
        </div>

        <!-- Main Card Container -->
        <div class="w-full bg-white/80 backdrop-blur-md rounded-3xl p-6 sm:p-8 shadow-xl shadow-coffee-900/5 border border-coffee-200/80 transition-all duration-300">
            
            <!-- Heading & Thank You Message -->
            <h1 class="font-serif text-2xl sm:text-3xl font-bold text-coffee-900 leading-snug mb-3">
                Terimakasih telah mengunjungi <span class="text-coffee-600 italic">Teraz Coffee</span>
            </h1>

            <p class="text-coffee-700/90 text-sm sm:text-base leading-relaxed mb-8">
                Ada ulasan yang ingin disampaikan? Silakan klik link di bawah ini:
            </p>

            <!-- CTA Google Review Button -->
            <a href="https://search.google.com/local/writereview?placeid=ChIJC1E9cgDBaS4RJU6juUlejRs" 
               target="_blank" 
               rel="noopener noreferrer"
               class="group relative w-full inline-flex items-center justify-center gap-3 px-6 py-4 rounded-2xl bg-gradient-to-r from-coffee-700 via-coffee-800 to-coffee-900 text-white font-semibold text-base shadow-lg shadow-coffee-800/25 hover:shadow-xl hover:shadow-coffee-800/35 active:scale-[0.98] transition-all duration-200 overflow-hidden">
                
                <!-- Shimmer Effect -->
                <div class="absolute inset-0 w-1/2 h-full bg-white/10 skew-x-12 -translate-x-full group-hover:translate-x-[300%] transition-transform duration-1000 ease-out"></div>

                <!-- Google Star / Review Icon -->
                <div class="p-1.5 bg-white/10 rounded-lg group-hover:scale-110 transition-transform duration-200">
                    <i data-lucide="star" class="w-5 h-5 text-amber-300 fill-amber-300"></i>
                </div>

                <span>Tulis Ulasan di Google</span>

                <!-- External Link Arrow -->
                <i data-lucide="arrow-right" class="w-5 h-5 text-coffee-300 group-hover:translate-x-1 transition-transform duration-200"></i>
            </a>

            <!-- Rating Stars Aesthetic Accent -->
            <div class="mt-6 flex items-center justify-center gap-1 text-amber-400 opacity-90">
                <i data-lucide="star" class="w-4 h-4 fill-amber-400"></i>
                <i data-lucide="star" class="w-4 h-4 fill-amber-400"></i>
                <i data-lucide="star" class="w-4 h-4 fill-amber-400"></i>
                <i data-lucide="star" class="w-4 h-4 fill-amber-400"></i>
                <i data-lucide="star" class="w-4 h-4 fill-amber-400"></i>
                <span class="text-xs text-coffee-600 font-medium ml-1.5">Ulasan Anda sangat berarti bagi kami</span>
            </div>
        </div>

        <!-- Farewell Message -->
        <div class="mt-8 flex items-center justify-center gap-2 text-coffee-700 text-sm font-medium bg-coffee-100/60 px-5 py-2.5 rounded-full border border-coffee-200/50 backdrop-blur-sm">
            <i data-lucide="heart" class="w-4 h-4 text-coffee-600 fill-coffee-600/20"></i>
            <span>Ditunggu kunjungan berikutnya kaka ✨</span>
        </div>

    </main>

    <!-- Footer -->
    <footer class="w-full text-center py-4 text-xs text-coffee-500/80">
        <p>&copy; <script>document.write(new Date().getFullYear())</script> Teraz Coffee. All rights reserved.</p>
    </footer>

    <!-- Initialize Lucide Icons -->
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
